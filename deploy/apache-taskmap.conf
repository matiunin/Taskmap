ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 40
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
    LimitRequestBody 1048576
    RewriteEngine On
    RewriteRule ^api/jira-proxy$ /api/jira-proxy.php [END]
    RewriteRule ^api/jira-media$ /api/jira-media.php [END]
    RewriteRule ^api/health$ /api/health.php [END]
    RewriteRule ^test$ /api/health.php [END]
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [END]
</Directory>

RequestReadTimeout header=10-20,MinRate=500 body=10-15,MinRate=500
Header always unset X-Powered-By
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

# Log paths/statuses only. Request bodies, headers and query strings are omitted.
LogFormat "%a %t \"%m %U %H\" %>s %b" taskmap
LogLevel crit
<VirtualHost *:80>
    DocumentRoot /var/www/html
    CustomLog /proc/self/fd/1 taskmap
    ErrorLog /proc/self/fd/2
</VirtualHost>
